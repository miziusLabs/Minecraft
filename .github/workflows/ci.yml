name: CI

on:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Detect a package version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          const pkg = JSON.parse(readFileSync("cli/package.json", "utf8"));
          let previous;
          if (!/^0+$/.test(process.env.BEFORE_SHA)) {
            const files = execFileSync("git", ["ls-tree", "--name-only", process.env.BEFORE_SHA, "cli/package.json"], { encoding: "utf8" }).trim();
            if (files) previous = JSON.parse(execFileSync("git", ["show", process.env.BEFORE_SHA + ":cli/package.json"], { encoding: "utf8" })).version;
          }
          if (pkg.name !== "@mizius/minecraft") throw new Error("Unexpected npm package name.");
          const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const changed = pkg.version !== previous && stable.test(pkg.version);
          if (changed && previous) {
            const current = pkg.version.split(".").map(BigInt);
            const old = previous.split("-")[0].split("+")[0].split(".").map(BigInt);
            const difference = current.findIndex((part, index) => part !== old[index]);
            if (difference >= 0 && current[difference] < old[difference]) throw new Error("Package version must increase.");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, "changed=" + changed + "\nversion=" + pkg.version + "\n");
          NODE

  mod:
    name: Mod on Minecraft ${{ matrix.minecraft }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test the mod
        run: .\gradlew.bat --no-daemon build "-Pminecraft_version=${{ matrix.minecraft }}"

  cli:
    name: CLI and npm package on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci
      - run: npm test
      - name: Build the distributable npm package
        run: |
          New-Item -ItemType Directory -Path artifacts/npm -Force | Out-Null
          npm pack --pack-destination artifacts/npm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the packed CLI can run
        run: |
          $package = @(Get-ChildItem artifacts/npm/*.tgz)
          if ($package.Count -ne 1) { throw 'Expected exactly one npm package.' }
          $installation = Join-Path $env:RUNNER_TEMP 'minecraft-package-smoke'
          npm install --prefix $installation --ignore-scripts --no-audit --no-fund $package[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $installation 'node_modules/.bin/minecraft.cmd') --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $installation 'node_modules/.bin/minecraft.cmd') versions --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: cli/artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    concurrency:
      group: github-release
      cancel-in-progress: false
    needs: [version, mod, cli]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Verify the package version
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          packages=(artifacts/*.tgz)
          test "${#packages[@]}" -eq 1
          tar -xOf "${packages[0]}" package/package.json > "$RUNNER_TEMP/packed-package.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/packed-package.json`, "utf8"));
            if (pkg.name !== "@mizius/minecraft" || process.env.PACKAGE_VERSION !== pkg.version) {
              throw new Error("Packed package does not match the version bump.");
            }
          '
      - name: Publish the tested package as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "Release tag v$RELEASE_VERSION already exists. Bump the package version again."
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" artifacts/*.tgz --target "$RELEASE_COMMIT" --title "Minecraft CLI v$RELEASE_VERSION" --generate-notes
