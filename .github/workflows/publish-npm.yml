name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    if: startsWith(github.event.release.tag_name, 'cli-v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the release tag and main branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("cli/package.json", "utf8"));
            if (pkg.name !== "@mizius/minecraft") throw new Error("Unexpected npm package name.");
            if (pkg.version.includes("-")) throw new Error("Publish a stable package version.");
            if (process.env.RELEASE_TAG !== `cli-v${pkg.version}`) throw new Error("Release tag must match cli/package.json version.");
          '
          git merge-base --is-ancestor HEAD origin/main

  checks:
    needs: validate-release
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Verify the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          packages=(artifacts/*.tgz)
          test "${#packages[@]}" -eq 1
          tar -xOf "${packages[0]}" package/package.json > "$RUNNER_TEMP/packed-package.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/packed-package.json`, "utf8"));
            if (pkg.name !== "@mizius/minecraft" || process.env.RELEASE_TAG !== `cli-v${pkg.version}`) {
              throw new Error("Packed package does not match the release.");
            }
          '
      - name: Publish the tested package
        # NPM_TOKEN can bootstrap the first release. Later releases use the
        # npm trusted publisher configured for this workflow, without a secret.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish artifacts/*.tgz --access public --provenance --ignore-scripts
